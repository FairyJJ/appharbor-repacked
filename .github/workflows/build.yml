name: repack

on:
  schedule:
    # 每天 03:00 UTC = 11:00 CST
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if this upstream tag was already published'
        type: boolean
        default: false

permissions:
  contents: write

env:
  APP: appharbor
  UPSTREAM: BeiChen-CN/AppHarbor
  OLD_PKG: com.app.market
  NEW_PKG: com.xiaomi.market
  ASSET_HINT: ''
  MOVE_CLASSES: 'true'
  RENAME_ASSETS: 'true'
  VERSION_CODE: '99999999'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve upstream release
        id: up
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/resolve_release.py \
            --repo "$UPSTREAM" \
            --asset-hint "$ASSET_HINT" \
            --prefix "$APP" \
            --out "$GITHUB_OUTPUT"

      - name: Decide whether to build
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.up.outputs.release_tag }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "force=true -> building"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists -> skip"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "new upstream tag -> build"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK
        if: steps.gate.outputs.build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install tooling
        if: steps.gate.outputs.build == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq aapt unzip
          curl -fsSL --retry 3 -o apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          curl -fsSL --retry 3 -o uber-apk-signer.jar \
            https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          java -jar apktool.jar --version
          ls -lh apktool.jar uber-apk-signer.jar

      - name: Download upstream APK
        if: steps.gate.outputs.build == 'true'
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o upstream.apk "${{ steps.up.outputs.asset_url }}"
          ls -lh upstream.apk
          sha256sum upstream.apk | tee upstream.sha256

      - name: Repack (rename package + pin versionCode)
        if: steps.gate.outputs.build == 'true'
        env:
          APKTOOL_JAR: ${{ github.workspace }}/apktool.jar
          SIGNER_JAR: ${{ github.workspace }}/uber-apk-signer.jar
        run: |
          set -euo pipefail
          EXTRA=""
          if [ "$MOVE_CLASSES" = "true" ]; then EXTRA="$EXTRA --move-classes"; fi
          if [ "$RENAME_ASSETS" = "true" ]; then EXTRA="$EXTRA --rename-assets"; fi
          python3 scripts/repack.py \
            --apk upstream.apk \
            --old "$OLD_PKG" \
            --new "$NEW_PKG" \
            --version-code "$VERSION_CODE" \
            $EXTRA \
            --out-dir dist
          ls -lh dist/

      - name: Publish release
        if: steps.gate.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.up.outputs.release_tag }}"
          APK="dist/$APP-${{ steps.up.outputs.tag }}-repacked.apk"
          mv "$(ls dist/*.apk | head -1)" "$APK"
          sha256sum "$APK" | tee dist/SHA256SUMS.txt
          NOTES=$(printf '%s\n' \
            "Upstream: $UPSTREAM @ ${{ steps.up.outputs.tag }}" \
            "Asset: ${{ steps.up.outputs.asset_name }}" \
            "" \
            "Built from [BeiChen-CN/AppHarbor](https://github.com/BeiChen-CN/AppHarbor) by" \
            "[@BeiChen-CN](https://github.com/BeiChen-CN) (fork of" \
            "[YXBwbWFya2V0/AppMarket](https://github.com/YXBwbWFya2V0/AppMarket)). All app code and" \
            "credit belong to the upstream author; this repo only renames the package." \
            "No license is declared upstream — treat this artifact as personal-use only." \
            "" \
            "Repacked for system package **$NEW_PKG** (was $OLD_PKG)." \
            "versionCode pinned to $VERSION_CODE so the data-partition install survives reboot." \
            "" \
            "Install:" \
            '```sh' \
            "adb install -r -t $APK" \
            '```')
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG exists -> re-uploading assets"
            gh release upload "$TAG" "$APK" dist/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --title "$APP ${{ steps.up.outputs.tag }}" \
              --notes "$NOTES"
          fi

      - name: Upload artifact
        if: steps.gate.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}-${{ steps.up.outputs.tag }}
          path: dist/*.apk
          retention-days: 30
